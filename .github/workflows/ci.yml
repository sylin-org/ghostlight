name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check source, public, and compatibility truth
        shell: pwsh
        run: ./scripts/check-public-surfaces.ps1
      - name: Check whole-repository integrity
        shell: pwsh
        run: ./scripts/check-repository-integrity.ps1

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The action does not infer the repository pin when given a moving channel. Keep this
      # immutable action revision and explicit toolchain aligned with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.95.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked --no-fail-fast

  extension:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm test --prefix extension
      - run: npm test --prefix packaging/npm
      - run: node --test packaging/mcpb/test/launcher.test.js
      - name: Check shell script syntax
        if: runner.os != 'Windows'
        run: sh -n scripts/*.sh
      - name: Check runtime JavaScript syntax
        run: |
          node --check extension/content.js
          node --check extension/offscreen.js
          node --check extension/options.js
          node --check extension/popup.js
          node --check extension/service-worker.js
          node --check extension/lib/chunks.js
          node --check extension/lib/debugger.js
          node --check extension/lib/diagnostics.js
          node --check extension/lib/engine.js
          node --check extension/lib/gif.js
          node --check extension/lib/presentation-queue.js
          node --check extension/lib/presentation.js
          node --check extension/lib/recording.js
          node --check extension/lib/shared.js
          node --check extension/lib/state.js
          node --check extension/lib/topology.js
      - name: Build the store extension artifact
        shell: pwsh
        run: ./scripts/package-extension.ps1 -OutputPath dist/ghostlight-extension.zip

  process-journeys:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.target-ci
      GHOSTLIGHT_BIN_DIR: ${{ github.workspace }}/.target-ci/debug
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: journeys-${{ matrix.os }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: cargo build --workspace --locked
      - run: node tests/connector-parent-lifecycle.mjs
      - if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a node tests/process-journey.mjs
      - if: runner.os == 'Windows'
        run: node tests/process-journey.mjs
      - if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a node tests/local-resilience-journey.mjs
      - if: runner.os == 'Windows'
        run: node tests/local-resilience-journey.mjs
      - if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a node tests/provenance-journey.mjs
      - if: runner.os == 'Windows'
        run: node tests/provenance-journey.mjs
      - if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a node tests/cli-journey.mjs
      - if: runner.os == 'Windows'
        run: node tests/cli-journey.mjs
      - if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a node tests/cli-powershell-journey.mjs
      - if: runner.os == 'Windows'
        run: node tests/cli-powershell-journey.mjs
      - run: node tests/workbench-surface.mjs
      - name: Verify native Windows desktop lifecycle
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File tests/windows-desktop-journey.ps1
      - name: Keep native Windows desktop evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: native-desktop-windows
          path: .tmp/native-desktop-*/results.json
          retention-days: 14

  browser-journeys:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.target-ci-browser
      # Only disposable test profiles use this flag. No installed browser is changed.
      GHOSTLIGHT_TEST_NO_SANDBOX: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: browser-${{ matrix.os }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install pinned Chrome for Testing
        shell: pwsh
        run: |
          $chromePlatform = if ($IsWindows) { 'win64' } else { 'linux64' }
          $chromeRoot = Join-Path $env:RUNNER_TEMP 'ghostlight-chrome'
          $chromeArchive = Join-Path $env:RUNNER_TEMP 'ghostlight-chrome.zip'
          Invoke-WebRequest "https://storage.googleapis.com/chrome-for-testing-public/152.0.7977.82/$chromePlatform/chrome-$chromePlatform.zip" -OutFile $chromeArchive
          Expand-Archive -LiteralPath $chromeArchive -DestinationPath $chromeRoot
          $chromeDirectory = Join-Path $chromeRoot "chrome-$chromePlatform"
          $chromeExecutable = Join-Path $chromeDirectory $(if ($IsWindows) { 'chrome.exe' } else { 'chrome' })
          if (-not $IsWindows) {
            chmod +x $chromeExecutable (Join-Path $chromeDirectory 'chrome_crashpad_handler') (Join-Path $chromeDirectory 'chrome_sandbox')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          "GHOSTLIGHT_TEST_BROWSER=$chromeExecutable" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run real Chromium regressions on fresh binaries
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a node tests/hardening-suite.mjs --lane=browser
      - name: Run real Chromium regressions on fresh binaries
        if: runner.os == 'Windows'
        run: node tests/hardening-suite.mjs --lane=browser
      - name: Keep browser test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hardening-browser-${{ matrix.os }}
          include-hidden-files: true
          path: |
            .tmp/hardening-suite/
            .tmp/h6-browser-evidence.json
            .tmp/h6-masked-sylin.jpg
            .tmp/h6-visual-*.png
            .tmp/h4-*.png
          retention-days: 14

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install dependency policy tools
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
      - run: cargo audit
      - run: cargo deny check licenses bans sources
