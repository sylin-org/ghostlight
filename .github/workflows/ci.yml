name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check source, public, and compatibility truth
        shell: pwsh
        run: ./scripts/check-public-surfaces.ps1
      - name: Regenerate the 0.8 evidence inventory
        shell: pwsh
        run: |
          ./scripts/harvest-0.8-test-inventory.ps1
          git diff --exit-code -- docs/0.8/test-inventory.json
      - name: Check every harvested behavior group has a disposition
        shell: pwsh
        run: ./scripts/check-0.8-recovery.ps1
      - name: Check every historical artifact has a disposition
        shell: pwsh
        run: ./scripts/check-0.8-artifacts.ps1
      - name: Check whole-repository integrity
        shell: pwsh
        run: ./scripts/check-repository-integrity.ps1

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The action does not infer the repository pin when given a moving channel. Keep this
      # immutable action revision and explicit toolchain aligned with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.95.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked --no-fail-fast

  extension:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm test --prefix extension
      - name: Check runtime JavaScript syntax
        run: |
          node --check extension/content.js
          node --check extension/offscreen.js
          node --check extension/options.js
          node --check extension/popup.js
          node --check extension/service-worker.js
          node --check extension/lib/chunks.js
          node --check extension/lib/debugger.js
          node --check extension/lib/diagnostics.js
          node --check extension/lib/engine.js
          node --check extension/lib/gif.js
          node --check extension/lib/presentation-queue.js
          node --check extension/lib/presentation.js
          node --check extension/lib/recording.js
          node --check extension/lib/shared.js
          node --check extension/lib/state.js
          node --check extension/lib/topology.js
      - name: Build the store extension artifact
        shell: pwsh
        run: ./scripts/package-extension.ps1 -OutputPath dist/ghostlight-extension.zip

  process-journeys:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.target-ci
      GHOSTLIGHT_BIN_DIR: ${{ github.workspace }}/.target-ci/debug
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: journeys-${{ matrix.os }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: cargo build --workspace --locked
      - run: node tests/process-journey.mjs
      - run: node tests/cli-journey.mjs
      - run: node tests/cli-powershell-journey.mjs
      - run: node tests/workbench-surface.mjs

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install dependency policy tools
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
      - run: cargo audit
      - run: cargo deny check licenses bans sources
