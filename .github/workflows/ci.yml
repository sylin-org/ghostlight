name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check source, public, and compatibility truth
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        run: ./scripts/check-public-surfaces.ps1
      - name: Check source, public, and compatibility truth for a release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: ./scripts/check-public-surfaces.ps1 -Release
      - name: Check whole-repository integrity
        shell: pwsh
        run: ./scripts/check-repository-integrity.ps1

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: rustc --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
      - run: cargo fetch --locked
      - run: node --test tests/guards/connectors.test.mjs

  extension:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm test --prefix extension
      - run: node --test "crates/orchestrator/src/browser/adapter/chromium/protocol4/assets/tests/*.test.js"
      - run: npm test --prefix packaging/npm
      - run: node --test packaging/mcpb/test/launcher.test.js
      - name: Check shell script syntax
        if: runner.os != 'Windows'
        run: sh -n scripts/*.sh
      - name: Check runtime JavaScript syntax
        shell: pwsh
        run: |
          $files = git ls-files 'extension/*.js' 'crates/orchestrator/*.js' | Where-Object { $_ -notmatch '/(tests|vendor)/' }
          foreach ($f in $files) { node --check $f; if ($LASTEXITCODE) { exit 1 } }
      - name: Check the workbench preview server syntax
        run: node --check tests/workbench-preview-server.mjs
      - name: Check the policy grammar readback
        run: node tests/policy-grammar.mjs
      - name: Build the store extension artifact
        shell: pwsh
        run: ./scripts/package-extension.ps1 -OutputPath dist/ghostlight-extension.zip

  process-journeys:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.target-ci
      GHOSTLIGHT_BIN_DIR: ${{ github.workspace }}/.target-ci/debug
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: journeys-${{ matrix.os }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: cargo build --workspace --locked
      - name: Verify the shell installer
        if: runner.os == 'Linux'
        run: node tests/installer-shell.mjs
      - run: node tests/edge-parent-lifecycle.mjs
      - name: Verify the fixed installation
        if: runner.os == 'Linux'
        run: node tests/fixed-installation-journey.mjs
      - run: node --test tests/lib/home.test.mjs
      - run: node tests/process-journey.mjs
      - run: node tests/local-resilience-journey.mjs
      - run: node tests/provenance-journey.mjs
      - run: node tests/history-compatibility.mjs
      - run: node tests/cli-journey.mjs
      - run: node tests/cli-powershell-journey.mjs
      - run: node tests/workbench-surface.mjs
      - name: Verify native Windows desktop lifecycle
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File tests/windows-desktop-journey.ps1
      - name: Keep native Windows desktop evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: native-desktop-windows
          path: .tmp/native-desktop-*/results.json
          retention-days: 14

  browser-journeys:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.target-ci-browser
      # Only disposable test profiles use this flag. No installed browser is changed.
      GHOSTLIGHT_TEST_NO_SANDBOX: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
      JOURNEY_WRAP: ${{ matrix.os == 'ubuntu-latest' && 'dbus-run-session -- xvfb-run -a ' || '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: browser-${{ matrix.os }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install pinned Chrome for Testing
        shell: pwsh
        run: |
          $chromePlatform = if ($IsWindows) { 'win64' } else { 'linux64' }
          $chromeRoot = Join-Path $env:RUNNER_TEMP 'ghostlight-chrome'
          $chromeArchive = Join-Path $env:RUNNER_TEMP 'ghostlight-chrome.zip'
          Invoke-WebRequest "https://storage.googleapis.com/chrome-for-testing-public/152.0.7977.82/$chromePlatform/chrome-$chromePlatform.zip" -OutFile $chromeArchive
          Expand-Archive -LiteralPath $chromeArchive -DestinationPath $chromeRoot
          $chromeDirectory = Join-Path $chromeRoot "chrome-$chromePlatform"
          $chromeExecutable = Join-Path $chromeDirectory $(if ($IsWindows) { 'chrome.exe' } else { 'chrome' })
          if (-not $IsWindows) {
            chmod +x $chromeExecutable (Join-Path $chromeDirectory 'chrome_crashpad_handler') (Join-Path $chromeDirectory 'chrome_sandbox')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          "GHOSTLIGHT_TEST_BROWSER=$chromeExecutable" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run real Chromium regressions on fresh binaries
        run: ${{ env.JOURNEY_WRAP }}node tests/hardening-suite.mjs --lane=browser
      - name: Keep browser test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hardening-browser-${{ matrix.os }}
          include-hidden-files: true
          path: |
            .tmp/hardening-suite/
            .tmp/h6-browser-evidence.json
            .tmp/h6-masked-sylin.jpg
            .tmp/h6-visual-*.png
            .tmp/h4-*.png
          retention-days: 14

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install dependency policy tools
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - run: cargo audit
      - run: cargo deny check licenses bans sources
