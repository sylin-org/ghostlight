name: Build release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install dependency policy tools
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - run: cargo audit
      - run: cargo deny check licenses bans sources

  quality-gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Require a green CI run for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          n=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push --branch "$GITHUB_REF_NAME" --status success --json databaseId --jq length)
          test "$n" -ge 1 || { echo "No successful push CI run of ci.yml for $GITHUB_SHA on $GITHUB_REF_NAME (it may still be running or was cancelled by a later push). Wait for green CI on this exact SHA, then re-dispatch."; exit 1; }
      - shell: pwsh
        run: ./scripts/check-public-surfaces.ps1 -Release
      - shell: pwsh
        run: ./scripts/check-repository-integrity.ps1

  release-binaries:
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - run: rustc --version
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build all three executable shores once
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - name: Stage version-matched raw binaries for launchers
        shell: pwsh
        run: |
          $extension = if ('${{ runner.os }}' -eq 'Windows') { '.exe' } else { '' }
          $output = "dist/raw-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          foreach ($name in @('ghostlight', 'ghostlight-service', 'ghostlight-desktop')) {
            Copy-Item -LiteralPath "target/${{ matrix.target }}/release/$name$extension" -Destination "$output/$name-${{ matrix.target }}$extension"
          }
      - name: Build the WinGet archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-winget-archive.ps1 -BinaryDirectory target/${{ matrix.target }}/release -OutputDirectory dist/winget-${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: |
            dist/raw-${{ matrix.target }}/
            dist/winget-${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7

  extension-artifact:
    needs: quality-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the deterministic store ZIP
        shell: pwsh
        run: ./scripts/package-extension.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: chrome-extension
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  candidate-bundle:
    needs: [supply-chain, quality-gate, release-binaries, extension-artifact]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: candidate-input
      - uses: actions/download-artifact@v8
        with:
          name: chrome-extension
          path: candidate-input/chrome-extension
      - name: Generate the pinned CycloneDX workspace SBOM
        shell: pwsh
        run: |
          $cargo = Get-Content -LiteralPath Cargo.toml -Raw
          $version = [regex]::Match($cargo, '(?ms)^\[workspace\.package\].*?^version\s*=\s*"(?<version>[^"]+)"').Groups['version'].Value
          if (-not $version) { throw 'Cargo.toml has no workspace package version' }
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          $env:SOURCE_DATE_EPOCH = (git show -s --format=%ct HEAD).Trim()
          cargo cyclonedx --format json --spec-version 1.5 --override-filename "ghostlight-v$version-sbom.cyclonedx"
          $sboms = @(Get-ChildItem -LiteralPath crates -Recurse -File -Filter "ghostlight-v$version-sbom.cyclonedx.json")
          if ($sboms.Count -eq 0) { throw "cargo-cyclonedx produced no SBOMs" }
          "GHOSTLIGHT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build checksum-bound client launchers from the raw candidates
        shell: pwsh
        run: |
          ./scripts/prepare-npm-package.ps1 `
            -ArtifactRoot candidate-input `
            -Version $env:GHOSTLIGHT_VERSION `
            -OutputDirectory candidate-input/derived/npm-package
          ./scripts/package-mcpb.ps1 `
            -ArtifactRoot candidate-input `
            -Version $env:GHOSTLIGHT_VERSION `
            -OutputPath candidate-input/derived/ghostlight-v$env:GHOSTLIGHT_VERSION.mcpb
      - name: Assemble and verify one immutable candidate unit
        shell: pwsh
        run: |
          $sboms = @(Get-ChildItem -LiteralPath crates -Recurse -File -Filter "ghostlight-v$env:GHOSTLIGHT_VERSION-sbom.cyclonedx.json")
          ./scripts/assemble-release-candidate.ps1 `
            -ArtifactRoot candidate-input `
            -SbomPath $sboms.FullName `
            -OutputDirectory dist/release-candidate `
            -Version $env:GHOSTLIGHT_VERSION `
            -SourceRevision $env:GITHUB_SHA
      - name: Attest every candidate file
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/release-candidate/assets/*
            dist/release-candidate/release-candidate.json
            dist/release-candidate/SHA256SUMS
      - name: Prepare the WinGet manifest from candidate hashes
        shell: pwsh
        run: ./scripts/prepare-winget-manifest.ps1 -CandidateDirectory dist/release-candidate
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: dist/release-candidate/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: dist/release-candidate/assets/*.tgz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: claude-desktop-mcpb
          path: dist/release-candidate/assets/*.mcpb
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: winget-manifest
          path: dist/winget-manifest/
          if-no-files-found: error
          retention-days: 14
