name: Build release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install existing dependency policy tools
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
      - run: cargo audit
      - run: cargo deny check licenses bans sources

  quality-gate:
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.target-release-gate
      GHOSTLIGHT_BIN_DIR: ${{ github.workspace }}/.target-release-gate/debug
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked --no-fail-fast
      - run: npm test --prefix extension
      - run: npm test --prefix packaging/npm
      - run: node --test packaging/mcpb/test/launcher.test.js
      - run: sh -n scripts/*.sh
      - run: node tests/installer-shell.mjs
      - run: node tests/connector-parent-lifecycle.mjs
      - run: dbus-run-session -- xvfb-run -a node tests/fixed-installation-journey.mjs
      - run: dbus-run-session -- xvfb-run -a node tests/process-journey.mjs
      - name: Verify one user installation across executable directories
        env:
          GHOSTLIGHT_JOURNEY_SINGLE_INSTALLATION: "1"
        run: dbus-run-session -- xvfb-run -a node tests/process-journey.mjs
      - run: dbus-run-session -- xvfb-run -a node tests/cli-journey.mjs
      - run: dbus-run-session -- xvfb-run -a node tests/cli-powershell-journey.mjs
      - run: node tests/workbench-surface.mjs
      - name: Install pinned Chrome for screenshot policy verification
        shell: pwsh
        run: |
          $chromeRoot = Join-Path $env:RUNNER_TEMP 'ghostlight-chrome'
          $chromeArchive = Join-Path $env:RUNNER_TEMP 'ghostlight-chrome.zip'
          Invoke-WebRequest 'https://storage.googleapis.com/chrome-for-testing-public/152.0.7977.82/linux64/chrome-linux64.zip' -OutFile $chromeArchive
          Expand-Archive -LiteralPath $chromeArchive -DestinationPath $chromeRoot
          $chromeDirectory = Join-Path $chromeRoot 'chrome-linux64'
          $chromeExecutable = Join-Path $chromeDirectory 'chrome'
          chmod +x $chromeExecutable (Join-Path $chromeDirectory 'chrome_crashpad_handler') (Join-Path $chromeDirectory 'chrome_sandbox')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "GHOSTLIGHT_TEST_BROWSER=$chromeExecutable" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify complete screenshots and binary refusal with the unchanged adapter
        env:
          GHOSTLIGHT_TEST_NO_SANDBOX: "1"
        run: dbus-run-session -- xvfb-run -a node tests/frame-browser-journey.mjs
      - name: Keep screenshot policy component evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-policy-linux
          path: .tmp/h6-browser-evidence.json
          if-no-files-found: warn
      - shell: pwsh
        run: ./scripts/check-public-surfaces.ps1 -Release
      - shell: pwsh
        run: ./scripts/check-repository-integrity.ps1

  release-binaries:
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - run: rustc --version
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build all three executable shores once
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - name: Verify Windows fixed-path replacement and downloader
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:GHOSTLIGHT_BIN_DIR = "$PWD/target/${{ matrix.target }}/release"
          node tests/fixed-installation-journey.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Fixed installation journey failed' }
          ./tests/installer-powershell.ps1 -BinaryDirectory $env:GHOSTLIGHT_BIN_DIR
      - name: Stage version-matched raw binaries for launchers
        shell: pwsh
        run: |
          $extension = if ('${{ runner.os }}' -eq 'Windows') { '.exe' } else { '' }
          $output = "dist/raw-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          foreach ($name in @('ghostlight', 'ghostlight-mcp-connector', 'ghostlight-browser-connector')) {
            Copy-Item -LiteralPath "target/${{ matrix.target }}/release/$name$extension" -Destination "$output/$name-${{ matrix.target }}$extension"
          }
      - name: Build the WinGet archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-winget-archive.ps1 -BinaryDirectory target/${{ matrix.target }}/release -OutputDirectory dist/winget-${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: |
            dist/raw-${{ matrix.target }}/
            dist/winget-${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7

  extension-artifact:
    needs: quality-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the deterministic store ZIP
        shell: pwsh
        run: ./scripts/package-extension.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: chrome-extension
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  candidate-bundle:
    needs: [supply-chain, quality-gate, release-binaries, extension-artifact]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: candidate-input
      - uses: actions/download-artifact@v8
        with:
          name: chrome-extension
          path: candidate-input/chrome-extension
      - name: Generate the pinned CycloneDX workspace SBOM
        shell: pwsh
        run: |
          $cargo = Get-Content -LiteralPath Cargo.toml -Raw
          $version = [regex]::Match($cargo, '(?ms)^\[workspace\.package\].*?^version\s*=\s*"(?<version>[^"]+)"').Groups['version'].Value
          if (-not $version) { throw 'Cargo.toml has no workspace package version' }
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          $env:SOURCE_DATE_EPOCH = (git show -s --format=%ct HEAD).Trim()
          cargo cyclonedx --format json --spec-version 1.5 --override-filename "ghostlight-v$version-sbom.cyclonedx"
          $sboms = @(Get-ChildItem -LiteralPath crates -Recurse -File -Filter "ghostlight-v$version-sbom.cyclonedx.json")
          if ($sboms.Count -eq 0) { throw "cargo-cyclonedx produced no SBOMs" }
          "GHOSTLIGHT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build checksum-bound client launchers from the raw candidates
        shell: pwsh
        run: |
          ./scripts/prepare-npm-package.ps1 `
            -ArtifactRoot candidate-input `
            -Version $env:GHOSTLIGHT_VERSION `
            -OutputDirectory candidate-input/derived/npm-package
          ./scripts/package-mcpb.ps1 `
            -ArtifactRoot candidate-input `
            -Version $env:GHOSTLIGHT_VERSION `
            -OutputPath candidate-input/derived/ghostlight-v$env:GHOSTLIGHT_VERSION.mcpb
      - name: Assemble and verify one immutable candidate unit
        shell: pwsh
        run: |
          $sboms = @(Get-ChildItem -LiteralPath crates -Recurse -File -Filter "ghostlight-v$env:GHOSTLIGHT_VERSION-sbom.cyclonedx.json")
          ./scripts/assemble-release-candidate.ps1 `
            -ArtifactRoot candidate-input `
            -SbomPath $sboms.FullName `
            -OutputDirectory dist/release-candidate `
            -Version $env:GHOSTLIGHT_VERSION `
            -SourceRevision $env:GITHUB_SHA
      - name: Attest every candidate file
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/release-candidate/assets/*
            dist/release-candidate/release-candidate.json
            dist/release-candidate/SHA256SUMS
      - name: Prepare the WinGet manifest from candidate hashes
        shell: pwsh
        run: ./scripts/prepare-winget-manifest.ps1 -CandidateDirectory dist/release-candidate
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: dist/release-candidate/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: dist/release-candidate/assets/*.tgz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: claude-desktop-mcpb
          path: dist/release-candidate/assets/*.mcpb
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: winget-manifest
          path: dist/winget-manifest/
          if-no-files-found: error
          retention-days: 14
