name: Build release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.target-release-gate
      GHOSTLIGHT_BIN_DIR: ${{ github.workspace }}/.target-release-gate/debug
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.95.0"
          components: clippy,rustfmt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked --no-fail-fast
      - run: npm test --prefix extension
      - run: npm test --prefix packaging/npm
      - run: node tests/process-journey.mjs
      - run: node tests/cli-journey.mjs
      - run: node tests/cli-powershell-journey.mjs
      - run: node tests/workbench-surface.mjs
      - shell: pwsh
        run: ./scripts/check-public-surfaces.ps1
      - shell: pwsh
        run: ./scripts/check-0.8-recovery.ps1
      - shell: pwsh
        run: ./scripts/check-0.8-artifacts.ps1
      - shell: pwsh
        run: ./scripts/check-repository-integrity.ps1

  native-packages:
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
            package_platform: windows
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
            package_platform: linux
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            package_platform: macos
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            package_platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install the pinned Tauri bundler
        run: cargo install tauri-cli --version 2.11.0 --locked
      - name: Build all three executable shores once
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - name: Stage version-matched raw binaries for launchers
        shell: pwsh
        run: |
          $extension = if ('${{ runner.os }}' -eq 'Windows') { '.exe' } else { '' }
          $output = "dist/raw-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          foreach ($name in @('ghostlight', 'ghostlight-mcp-connector', 'ghostlight-browser-connector')) {
            Copy-Item -LiteralPath "target/${{ matrix.target }}/release/$name$extension" -Destination "$output/$name-${{ matrix.target }}$extension"
          }
      - name: Stage exact Tauri sidecars
        shell: pwsh
        run: ./scripts/stage-tauri-sidecars.ps1 -TargetTriple ${{ matrix.target }}
      - name: Build the unsigned native candidate
        working-directory: crates/orchestrator
        run: cargo tauri build --config tauri.release.conf.json --bundles ${{ matrix.bundles }} --target ${{ matrix.target }} --ci --no-sign
      - name: Verify Windows package contents
        if: matrix.package_platform == 'windows'
        shell: pwsh
        run: |
          $artifact = Get-ChildItem -LiteralPath target/${{ matrix.target }}/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1 -ExpandProperty FullName
          ./scripts/check-native-package.ps1 -Platform windows -Artifact $artifact
      - name: Verify Debian package contents
        if: matrix.package_platform == 'linux'
        shell: pwsh
        run: |
          $artifact = Get-ChildItem -LiteralPath target/${{ matrix.target }}/release/bundle/deb -Filter '*.deb' | Select-Object -First 1 -ExpandProperty FullName
          ./scripts/check-native-package.ps1 -Platform linux -Artifact $artifact
      - name: Verify macOS application contents
        if: matrix.package_platform == 'macos'
        shell: pwsh
        run: |
          $artifact = Get-ChildItem -LiteralPath target/${{ matrix.target }}/release/bundle/macos -Filter '*.app' | Select-Object -First 1 -ExpandProperty FullName
          ./scripts/check-native-package.ps1 -Platform macos -Artifact $artifact
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/
            dist/raw-${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7

  extension-artifact:
    needs: quality-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the deterministic store ZIP
        shell: pwsh
        run: ./scripts/package-extension.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: chrome-extension
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  candidate-bundle:
    needs: [quality-gate, native-packages, extension-artifact]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.95.0"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: candidate-input
      - uses: actions/download-artifact@v8
        with:
          name: chrome-extension
          path: candidate-input/chrome-extension
      - name: Generate the pinned CycloneDX workspace SBOM
        shell: pwsh
        run: |
          $cargo = Get-Content -LiteralPath Cargo.toml -Raw
          $version = [regex]::Match($cargo, '(?ms)^\[workspace\.package\].*?^version\s*=\s*"(?<version>[^"]+)"').Groups['version'].Value
          if (-not $version) { throw 'Cargo.toml has no workspace package version' }
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          $env:SOURCE_DATE_EPOCH = (git show -s --format=%ct HEAD).Trim()
          cargo cyclonedx --format json --spec-version 1.5 --override-filename "ghostlight-v$version-sbom.cyclonedx"
          $sboms = @(Get-ChildItem -LiteralPath crates -Recurse -File -Filter "ghostlight-v$version-sbom.cyclonedx.json")
          if ($sboms.Count -ne 4) { throw "cargo-cyclonedx produced $($sboms.Count) component SBOMs, expected 4" }
          "GHOSTLIGHT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Assemble and verify one immutable candidate unit
        shell: pwsh
        run: |
          $sboms = @(Get-ChildItem -LiteralPath crates -Recurse -File -Filter "ghostlight-v$env:GHOSTLIGHT_VERSION-sbom.cyclonedx.json")
          ./scripts/assemble-release-candidate.ps1 `
            -ArtifactRoot candidate-input `
            -SbomPath $sboms.FullName `
            -OutputDirectory dist/release-candidate `
            -Version $env:GHOSTLIGHT_VERSION `
            -SourceRevision $env:GITHUB_SHA
      - name: Attest every candidate file
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/release-candidate/assets/*
            dist/release-candidate/release-candidate.json
            dist/release-candidate/SHA256SUMS
      - name: Prepare the checksum-bound npm launcher
        shell: pwsh
        run: ./scripts/prepare-npm-package.ps1 -CandidateDirectory dist/release-candidate
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: dist/release-candidate/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: dist/npm-package/*.tgz
          if-no-files-found: error
          retention-days: 14
