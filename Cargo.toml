[workspace]
members = [
    "crates/bridge",
    "crates/orchestrator",
    "crates/relay",
    "crates/edge",
    "crates/win-peer",
    "crates/desktop",
]
resolver = "2"

[workspace.package]
version = "1.3.15"
edition = "2021"
license = "Apache-2.0 OR MIT"
rust-version = "1.89"
authors = ["Leonardo Botinelly <hello@sylin.org>"]
description = "Visible local browser automation with optional policy and audit"
homepage = "https://sylin.org/ghostlight/"
repository = "https://github.com/sylin-org/ghostlight"

[profile.release]
strip = "symbols"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
url = "2.5"
uuid = { version = "1.10", features = ["v4"] }
zeroize = { version = "1", features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[patch.crates-io]
# The shell's window library, Tao 0.35.3, has a custom Wayland titlebar that swallows its own
# control-button events. Pin Tao's merged upstream fix until a release carries it (Tao 0.36 or
# newer). See ADR-0120.
tao = { git = "https://github.com/tauri-apps/tao", rev = "07f3742b1833b64be27b1ef991e38d557d4276c9" }
