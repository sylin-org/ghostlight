[workspace]
members = [
    "crates/bridge",
    "crates/orchestrator",
    "crates/mcp-connector",
    "crates/browser-connector",
    "crates/win-peer",
]
resolver = "2"

[workspace.package]
version = "1.3.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
rust-version = "1.82"
authors = ["Leonardo Botinelly <hello@sylin.org>"]
description = "Visible local browser automation with optional policy and audit"
homepage = "https://sylin.org/ghostlight/"
repository = "https://github.com/sylin-org/ghostlight"

[profile.release]
strip = "symbols"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
fs2 = "=0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[patch.crates-io]
# Tauri 2.11 still selects Tao 0.35.3, whose custom Wayland titlebar swallows
# its own control-button events. Pin Tao's merged upstream fix until a Tauri
# release selects Tao 0.36 or newer. See ADR-0120.
tao = { git = "https://github.com/tauri-apps/tao", rev = "07f3742b1833b64be27b1ef991e38d557d4276c9" }
