# cargo audit reads this file from the repository's .cargo directory (the release workflow and
# audit.yml run `cargo audit` at the repository root).
#
# RUSTSEC-2026-0381: webpki-roots below 1.0.10 bundles the distrusted "emSign ECC Root CA - G3".
# Cargo.lock holds webpki-roots 1.0.10, which removes it. ureq 2 also depends on webpki-roots
# 0.26.11, whose whole library is `pub use parent::TLS_SERVER_ROOTS` from webpki-roots 1, so it
# carries 1.0.10's roots; the advisory flags it by its version number alone. This exception is a
# spot fix: remove it when the service moves to ureq 3, which depends on webpki-roots 1 directly,
# and never keep it with a webpki-roots 1 below 1.0.10 in Cargo.lock.
[advisories]
ignore = ["RUSTSEC-2026-0381"]
