<!doctype html>
<html lang="en" class="gl-page">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Set up Ghostlight</title>
    <link rel="stylesheet" href="kit.css">
  </head>
  <body class="gl-stage gl-setup">
    <header class="gl-setup__top">
      <span class="gl-wordmark">Ghostlight</span>
      <a class="gl-setup__doc" id="doc-link" href="#" target="_blank" rel="noopener" hidden></a>
    </header>
    <main class="gl-setup__main">
      <section class="gl-companion" id="companion" data-light="waiting" aria-label="Setup progress">
        <div class="gl-companion__art">
          <span class="gl-mascot gl-companion__mascot">
            <span class="gl-mascot__halo"></span>
            <img class="gl-px gl-mascot__img" src="icons/ghostlight-mascot.png" alt="" width="200" height="200">
            <span class="gl-lantern" aria-hidden="true"><span class="gl-lantern__ember"></span><span class="gl-lantern__ring"></span><i class="gl-lantern__mote"></i><i class="gl-lantern__mote"></i><i class="gl-lantern__mote"></i><i class="gl-lantern__mote"></i><i class="gl-lantern__mote"></i><i class="gl-lantern__mote"></i></span>
          </span>
        </div>
        <div class="gl-stepper" aria-hidden="true">
          <span class="gl-stepper__seg gl-stepper__seg--1"><i></i></span><span class="gl-stepper__seg gl-stepper__seg--2"><i></i></span>
          <span class="gl-stepper__disc gl-stepper__disc--0"></span><span class="gl-stepper__disc gl-stepper__disc--1"></span><span class="gl-stepper__disc gl-stepper__disc--2"></span>
        </div>
        <ol class="gl-stepper__names">
          <li><span class="gl-stepper__t"></span><span class="gl-sr"></span><span class="gl-stepper__w"></span></li><li><span class="gl-stepper__t"></span><span class="gl-sr"></span><span class="gl-stepper__w"></span></li><li><span class="gl-stepper__t"></span><span class="gl-sr"></span><span class="gl-stepper__w"></span></li>
        </ol>
      </section>
      <div class="gl-setup__col">
        <div class="gl-setup__part" id="main"></div>
        <p class="gl-live" id="live" role="status" aria-live="polite"></p>
        <div class="gl-setup__part" id="after"></div>
      </div>
    </main>
    <div class="gl-sr" id="announce" aria-live="polite" aria-atomic="true"></div>
    <script src="lib/shared.js"></script>
    <script src="lib/setup-view.js"></script>
    <script src="setup.js"></script>
  </body>
</html>
