<!doctype html>
<html lang="en" class="gl-page">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ghostlight</title>
    <link rel="stylesheet" href="kit.css">
  </head>
  <body class="gl-popup">
    <div class="gl-pop" id="pop" data-light="waiting">
      <div class="gl-pop__head">
        <div class="gl-pop__art">
          <span class="gl-mascot gl-companion__mascot gl-companion__mascot--sm">
            <span class="gl-mascot__halo"></span>
            <img class="gl-px gl-mascot__img" src="icons/ghostlight-mascot.png" alt="" width="100" height="100">
            <span class="gl-lantern" aria-hidden="true"><span class="gl-lantern__ember"></span><span class="gl-lantern__ring"></span><i class="gl-lantern__mote"></i><i class="gl-lantern__mote"></i><i class="gl-lantern__mote"></i><i class="gl-lantern__mote"></i><i class="gl-lantern__mote"></i><i class="gl-lantern__mote"></i></span>
          </span>
        </div>
        <div role="status" aria-live="polite">
          <span class="gl-eyebrow gl-eyebrow--quiet" id="eyebrow"></span>
          <p class="gl-pop__title" id="title"></p>
          <p class="gl-pop__line" id="line"></p>
          <p class="gl-pop__line" id="line2" hidden></p>
        </div>
      </div>
      <p class="gl-pop__note" id="note" hidden></p>
      <div id="actions"></div>
      <p class="gl-pop__problem" id="problem" role="alert" hidden></p>
      <p class="gl-pop__foot"><button class="gl-quiet" id="show" type="button" hidden></button><a class="gl-quiet" id="settings" href="options.html"></a></p>
    </div>
    <script src="lib/shared.js"></script>
    <script src="lib/setup-view.js"></script>
    <script src="lib/popup-view.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
