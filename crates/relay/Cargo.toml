[package]
name = "ghostlight-relay"
publish = false
# The relay revision, not the product version. Connectors never read CARGO_PKG_VERSION.
version = "3.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Frozen relay protocol 3 contracts shared by the Ghostlight connectors and service"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
ghostlight-win-peer = { path = "../win-peer" }

# This crate does not inherit the workspace lints table: Cargo applies inherited lints as
# command-line flags, and an inherited forbid cannot be lifted by one module. The frozen relay
# needs platform calls that have no safe standard-library form (starting the service with no
# inherited handles, and the Windows parent watch), so it sets deny. Only the `os` module lifts it,
# with an expect that names the reason. A repository guard test checks every workspace member.

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
