[package]
name = "ghostlight-service"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
ed25519-dalek = "2"
fips204 = "0.4"
getrandom = "0.2"
ghostlight-bridge = { path = "../bridge" }
ghostlight-relay = { path = "../relay" }
ghostlight-win-peer = { path = "../win-peer" }
jsonc-parser = { version = "=0.26.3", features = ["cst", "serde"] }
png = "0.18.1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time = { version = "0.3", default-features = false, features = ["local-offset", "std"] }
toml_edit = "=0.22.27"
ureq = { version = "2", default-features = false, features = ["tls"] }
url.workspace = true
uuid.workspace = true
zeroize.workspace = true
sysinfo = { version = "=0.36.1", default-features = false, features = ["system"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(windows)'.dependencies]
winreg = "=0.55.0"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.11"

[lints]
workspace = true
