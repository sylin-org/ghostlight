[package]
name = "ghostlight"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
ed25519-dalek = "2"
fips204 = "0.4"
getrandom = "0.2"
ghostlight-bridge = { path = "../bridge" }
jsonc-parser = { version = "=0.26.3", features = ["cst", "serde"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tauri = { version = "=2.11.5", features = ["image-png", "tray-icon"] }
tauri-plugin-notification = "=2.3.3"
tauri-plugin-opener = "=2.5.4"
toml_edit = "=0.22.27"
ureq = { version = "2", default-features = false, features = ["tls"] }
url.workspace = true
uuid.workspace = true
zeroize.workspace = true
sysinfo = { version = "=0.36.1", default-features = false, features = ["system"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(windows)'.dependencies]
winreg = "=0.55.0"

[target.'cfg(target_os = "linux")'.dependencies]
glib = "=0.18.5"
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[lints]
workspace = true
