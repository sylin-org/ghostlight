[package]
name = "ghostlight-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "The Ghostlight window: one webview on the service's loopback workbench, and a tray"
publish = false

[dependencies]
ghostlight-relay = { path = "../relay" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
png = "0.18.1"
notify-rust = { version = "=4.18.0", default-features = false, features = ["d"] }
open = { version = "=5.4.1", features = ["shellexecute-on-windows"] }
tao = "=0.35.3"
tray-icon = { version = "=0.24.2", default-features = false, features = ["gtk"] }
wry = "=0.55.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
webkit2gtk = "=2.0.2"

[target.'cfg(windows)'.dependencies]
rfd = { version = "=0.16.0", default-features = false, features = ["common-controls-v6"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.11"

[lints]
workspace = true
